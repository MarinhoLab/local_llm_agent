# Agent Canvas — all-in-one stack (client UI + agent-server + automation
# server + ingress) in a single container, per
# https://docs.openhands.dev/openhands/usage/agent-canvas/setup ("Docker").
#
# The image serves the Canvas UI at http://localhost:8010/canvas (host port
# AGENT_CANVAS_PORT -> 8000 inside the container). The agent-server API is
# reachable at the same ingress (e.g. /api/conversations), protected by a
# session API key that the launcher auto-generates and persists in the
# .openhands state mount.
#
# Port choice: 8010 keeps this stack clear of the other one in this repo —
# 8000 (SSH tunnel to the Spark's vLLM) on the host.

services:
  agent-canvas:
    # Multi-arch image (pulls arm64 on Apple Silicon). Pin a specific tag in
    # .env before a release if reproducibility matters; otherwise
    # `docker compose pull` + `docker compose up -d` to update.
    image: ghcr.io/openhands/agent-canvas:${AGENT_CANVAS_TAG:-latest}
    container_name: agent-canvas

    ports:
      - "${AGENT_CANVAS_PORT:-8010}:8000"

    volumes:
      # Settings, LLM profile, API key, and conversation data persist here —
      # survives `--rm` / image updates.
      - ${AGENT_CANVAS_STATE:-./openhands-state}:/home/openhands/.openhands
      # Project files the canvas agents may work in. Container-side boundary:
      # agents can only touch what is mounted.
      - ${PROJECTS_DIR:-./projects}:/projects

    # Lets the backend reach host-published services through the tunnel —
    # i.e. the Spark's vLLM at http://host.docker.internal:8000/v1 (Settings
    # > LLM in the UI).
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Privileged (default on) so in-container Docker can pull images: the
    # OpenHands sandbox runs a nested Docker daemon, and extracting image
    # layers needs CAP_SYS_ADMIN to mount/unshare them — the default
    # unprivileged capability set lacks it (pulls then fail with
    # "operation not permitted" at layer extraction). Trade-off: a privileged
    # container weakens the "canvas agents are untrusted, the container is the
    # sandbox boundary" posture — an agent that escapes the process sandbox
    # reaches the host. Set AGENT_CANVAS_PRIVILEGED=false to restore that
    # boundary and give up in-container docker pulls. Still no docker.sock or
    # gpus are exposed either way.
    privileged: ${AGENT_CANVAS_PRIVILEGED:-true}

    restart: unless-stopped
