# Agent Canvas — all-in-one stack (client UI + agent-server + automation
# server + ingress) in a single container, per
# https://docs.openhands.dev/openhands/usage/agent-canvas/setup ("Docker").
#
# The image serves the Canvas UI at http://localhost:8010/canvas (host port
# AGENT_CANVAS_PORT -> 8000 inside the container). The agent-server API is
# reachable at the same ingress (e.g. /api/conversations), protected by a
# session API key that the launcher auto-generates and persists in the
# .openhands state mount.
#
# Port choice: 8010 keeps this stack clear of the other one in this repo —
# 8000 (SSH tunnel to the Spark's vLLM) on the host.

services:
  agent-canvas:
    # Multi-arch image (pulls arm64 on Apple Silicon). Pin a specific tag in
    # .env before a release if reproducibility matters; otherwise
    # `docker compose pull` + `docker compose up -d` to update.
    image: ghcr.io/openhands/agent-canvas:${AGENT_CANVAS_TAG:-latest}
    container_name: agent-canvas

    ports:
      - "${AGENT_CANVAS_PORT:-8010}:8000"

    volumes:
      # Settings, LLM profile, API key, and conversation data persist here —
      # survives `--rm` / image updates.
      - ${AGENT_CANVAS_STATE:-./openhands-state}:/home/openhands/.openhands
      # Project files the canvas agents may work in. Container-side boundary:
      # agents can only touch what is mounted.
      - ${PROJECTS_DIR:-./projects}:/projects
      # Share the HOST Docker daemon with the agent: the host socket is
      # bind-mounted at /var/run/docker.sock and DOCKER_HOST (see environment)
      # points the in-container client at it. The agent talks to the host
      # daemon directly instead of running a nested `dockerd`, which avoids the
      # docker-in-docker problems (overlay-on-overlay mount failures, image
      # layer extraction needing CAP_SYS_ADMIN, a duplicate network stack).
      # The default path exists on Linux and on Docker Desktop (macOS/Windows);
      # override AGENT_CANVAS_DOCKER_SOCKET in .env if your socket lives
      # elsewhere (e.g. //./pipe/dockerDesktopLinuxContainers on Windows).
      # If your host has no Docker daemon, remove this line — the agent then
      # has no Docker unless it runs its own nested daemon
      # (AGENT_CANVAS_PRIVILEGED=true).
      - ${AGENT_CANVAS_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock

    # Lets the backend reach host-published services through the tunnel —
    # i.e. the Spark's vLLM at http://host.docker.internal:8000/v1 (Settings
    # > LLM in the UI).
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Point the in-container Docker client at the mounted host socket so
    # `docker` (and `sudo docker`) talks to the HOST daemon instead of a local
    # one the agent would otherwise start with a nested `dockerd`.
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock

    # Not privileged by default: with the host socket shared, the agent runs
    # the host daemon directly and needs no CAP_SYS_ADMIN, so the stricter
    # "canvas agents are untrusted, the container is the sandbox boundary"
    # posture is restored. Set AGENT_CANVAS_PRIVILEGED=true only if the agent
    # should run its OWN nested `dockerd` (e.g. the host has no Docker daemon,
    # or you deliberately want the agent's containers isolated from the host
    # daemon) — that path needs CAP_SYS_ADMIN to extract image layers and
    # weakens the sandbox boundary (an escaping agent reaches the host).
    # No GPUs are exposed either way.
    privileged: ${AGENT_CANVAS_PRIVILEGED:-false}

    restart: unless-stopped
