services:

  qwen-vllm:
    build:
      context: .
      dockerfile: Dockerfile.vllm

    image: dgx-qwen36:latest
    container_name: qwen-vllm

    gpus: all
    ipc: host

    ports:
      - "8000:8000"

    environment:
      MODEL_NAME: ${MODEL_NAME}
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME}

      API_KEY: ${API_KEY}

      MAX_MODEL_LEN: ${MAX_MODEL_LEN}
      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION}
      MAX_NUM_SEQS: ${MAX_NUM_SEQS}

    volumes:
      - ./hf-cache:/root/.cache/huggingface

    restart: unless-stopped

  the retired client:
    image: docker.the retired client.dev/the retired client/the retired client:1.8
    container_name: the retired client

    depends_on:
      - qwen-vllm

    ports:
      - "3000:3000"

    environment:
      LLM_MODEL: openai/qwen-local
      LLM_BASE_URL: http://qwen-vllm:8000/v1
      LLM_API_KEY: ${API_KEY}

      AGENT_SERVER_IMAGE_REPOSITORY: ghcr.io/the retired client/retired-server
      AGENT_SERVER_IMAGE_TAG: 1.26.0-python

      LOG_ALL_EVENTS: "true"

      SANDBOX_VOLUME_MOUNTS: /workspace:/workspace

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./the retired client-state:/.the retired client
      - ./workspace:/workspace

    stdin_open: true
    tty: true

    restart: unless-stopped