# compose.yml
# Start with: docker compose -f compose.yml up --build

services:
  qwen-vllm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dgx-qwen-vllm

    # Requires NVIDIA Container Toolkit on the DGX Spark host.
    gpus: all
    ipc: host

    environment:
      - PYTHONUNBUFFERED=1
      # Selectable DGX-side model configuration: nvfp4 (default) or b16.
      # Set it in .env (or the process environment) to switch checkpoints.
      - MODEL_CONFIG=${MODEL_CONFIG:-nvfp4}

    ports:
      - "8000:8000"

    volumes:
      - ${HF_CACHE:-./hf-cache}:/root/.cache/huggingface

    restart: unless-stopped
