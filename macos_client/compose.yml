# compose.yml

services:
  openhands:
    image: docker.openhands.dev/openhands/openhands:${OPENHANDS_TAG}
    container_name: openhands
    pull_policy: always

    ports:
      - "${OPENHANDS_PORT}:3000"

    environment:
      AGENT_SERVER_IMAGE_REPOSITORY: ${AGENT_SERVER_IMAGE_REPOSITORY}
      AGENT_SERVER_IMAGE_TAG: ${AGENT_SERVER_IMAGE_TAG}
      LOG_ALL_EVENTS: ${LOG_ALL_EVENTS}

      LLM_MODEL: ${LLM_MODEL}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}

      SANDBOX_VOLUMES: ${WORKSPACE_DIR}:/workspace:rw,/var/run/docker.sock:/var/run/docker.sock:rw

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${OPENHANDS_STATE}:/.openhands
      - ${WORKSPACE_DIR}:/workspace

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - duckduckgo-mcp

    stdin_open: true
    tty: true
    restart: unless-stopped

  duckduckgo-mcp:
    image: python:3.12-slim
    container_name: duckduckgo-mcp
    # DNS-rebinding allowlist for the SSE transport. The client is the
    # OpenHands agent-server container (launched by the openhands app), which
    # dials this service at http://host.docker.internal:8001/sse via the
    # published host port; the localhost entries cover a non-Docker
    # OpenHands running directly on the Mac.
    command: >
      bash -c "
      pip install --no-cache-dir duckduckgo-mcp-server &&
      duckduckgo-mcp-server --transport sse --host 0.0.0.0
      --allowed-hosts host.docker.internal:* localhost:* 127.0.0.1:*
      "
    ports:
      - "8001:8000"
    restart: unless-stopped