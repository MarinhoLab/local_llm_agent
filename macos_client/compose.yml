# compose.yml

services:
  openhands:
    image: docker.openhands.dev/openhands/openhands:${OPENHANDS_TAG}
    container_name: openhands
    pull_policy: always

    ports:
      - "${OPENHANDS_PORT}:3000"

    environment:
      LOG_ALL_EVENTS: ${LOG_ALL_EVENTS}
      LOG_LEVEL: ${LOG_LEVEL}
      # Sandbox startup (agent-server container) timeouts. Verified against the
      # app-server source of docker.openhands.dev/openhands/openhands:latest
      # (commit f4bfa7f9, 2026-07-21):
      # - SANDBOX_STARTUP_GRACE_SECONDS: agent-server /health must answer within
      #   this many seconds of container StartedAt or the sandbox is marked
      #   ERROR ("Sandbox server not running"). Default is 15, too short for the
      #   heavy agent-server image on a macOS Docker VM.
      # - OH_APP_CONVERSATION_SANDBOX_STARTUP_TIMEOUT: outer polling window of
      #   wait_for_sandbox_running(). Default is 120.
      # Note: the legacy SANDBOX_TIMEOUT variable is NOT read by the V1
      # app-server and has no effect.
      SANDBOX_STARTUP_GRACE_SECONDS: "600"
      OH_APP_CONVERSATION_SANDBOX_STARTUP_TIMEOUT: "600"
      # NOTE: the LLM is NOT configured via container env vars here. The V1 web
      # app reads the LLM from its own settings store (GUI: Settings -> LLM),
      # which persists in the state volume. The legacy LLM_MODEL / LLM_BASE_URL /
      # LLM_API_KEY container env vars are only honored by the V0/CLI path
      # (LLM.load_from_env + --override-with-envs) and are ignored by the web app.
      # To configure from a file instead of the GUI, the `oh-bootstrap` sidecar
      # (below) reads LLM_*/TAVILY_API_KEY from .env and writes them into the
      # settings store via the V1 API on each start. See MEMORIES.md.
      #
      # Per-LLM-request HTTP timeout: the V1 web app uses the SDK default
      # (300s), set on the LLM object from the profile — there is no env knob
      # for it. (A previous LLM_TIMEOUT=120 here was a no-op: the AUTO_FORWARD
      # mechanism the old comment cited no longer exists in the SDK, and the
      # agent-server does not read any LLM_* env vars.)

      SANDBOX_VOLUMES: ${WORKSPACE_DIR}:/workspace:rw,/var/run/docker.sock:/var/run/docker.sock:rw

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${OPENHANDS_STATE}:/.openhands
      - ${WORKSPACE_DIR}:/workspace

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - duckduckgo-mcp

    stdin_open: true
    tty: true
    restart: unless-stopped

  # One-shot bootstrap: copies the LLM + MCP config from .env into the
  # OpenHands settings store on each start (idempotent, no-op once configured).
  # The V1 web app ignores LLM_* / TAVILY_API_KEY env vars, so this is the bridge.
  # See MEMORIES.md for the full rationale. Exits 0 on success (stays stopped);
  # `on-failure` retries only if the app server was unreachable.
  oh-bootstrap:
    image: docker.openhands.dev/openhands/openhands:${OPENHANDS_TAG}
    container_name: oh-bootstrap
    pull_policy: always
    # Bypass the image entrypoint.sh (which starts the server + needs
    # SANDBOX_USER_ID); just run the stdlib bootstrap script as root.
    entrypoint: ["python", "/bootstrap/oh_bootstrap.py"]
    command: []
    volumes:
      - ./oh_bootstrap.py:/bootstrap/oh_bootstrap.py:ro
    environment:
      OH_URL: http://openhands:3000
      LLM_MODEL: ${LLM_MODEL}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_PROFILE_NAME: ${LLM_PROFILE_NAME}
      DUCKDUCKGO_MCP_URL: ${DUCKDUCKGO_MCP_URL}
      TAVILY_URL: ${TAVILY_URL}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
    depends_on:
      - openhands
    restart: on-failure

  duckduckgo-mcp:
    image: python:3.12-slim
    container_name: duckduckgo-mcp
    # DNS-rebinding allowlist for the SSE transport. The client is the
    # OpenHands agent-server container (launched by the openhands app), which
    # dials this service at http://host.docker.internal:8001/sse via the
    # published host port; the localhost entries cover a non-Docker
    # OpenHands running directly on the Mac.
    command: >
      bash -c "
      pip install --no-cache-dir duckduckgo-mcp-server &&
      duckduckgo-mcp-server --transport sse --host 0.0.0.0
      --allowed-hosts host.docker.internal:* localhost:* 127.0.0.1:*
      "
    ports:
      - "8001:8000"
    restart: unless-stopped
