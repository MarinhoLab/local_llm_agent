# compose.yml
# Single-command macOS client-side stack:
#   docker compose up

name: dgx-macos-agents

services:
  openhands:
    image: docker.openhands.dev/openhands/openhands:${OPENHANDS_TAG:-1.8}
    container_name: openhands
    pull_policy: always

    ports:
      - "${OPENHANDS_PORT:-3000}:3000"

    environment:
      AGENT_SERVER_IMAGE_REPOSITORY: ${AGENT_SERVER_IMAGE_REPOSITORY:-ghcr.io/openhands/agent-server}
      AGENT_SERVER_IMAGE_TAG: ${AGENT_SERVER_IMAGE_TAG:-1.26.0-python}
      LOG_ALL_EVENTS: ${LOG_ALL_EVENTS:-true}
      LLM_MODEL: ${LLM_MODEL:-openai/qwen-local}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8000/v1}
      LLM_API_KEY: ${LLM_API_KEY:-local-dgx-key}
      SANDBOX_VOLUME_MOUNTS: /workspace:/workspace

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${OPENHANDS_STATE:-./openhands-state}:/.openhands
      - ${WORKSPACE_DIR:-./workspace}:/workspace

    extra_hosts:
      - "host.docker.internal:host-gateway"

    stdin_open: true
    tty: true
    restart: unless-stopped

  aider:
    build:
      context: .
      dockerfile: Dockerfile.aider
    container_name: aider-dgx

    environment:
      OPENAI_API_BASE: ${OPENAI_API_BASE:-http://host.docker.internal:8000/v1}
      OPENAI_API_KEY: ${LLM_API_KEY:-local-dgx-key}
      AIDER_MODEL: ${AIDER_MODEL:-openai/qwen-local}

    volumes:
      - ${WORKSPACE_DIR:-./workspace}:/workspace
      - ${GITCONFIG:-${HOME}/.gitconfig}:/root/.gitconfig:ro

    stdin_open: true
    tty: true
    command: >
      bash -lc 'echo "Aider container ready.";
      echo "Run: docker exec -it aider-dgx bash";
      tail -f /dev/null'
    restart: unless-stopped

  endpoint-check:
    build:
      context: .
      dockerfile: Dockerfile.aider
    container_name: dgx-endpoint-check

    environment:
      LLM_API_KEY: ${LLM_API_KEY:-local-dgx-key}

    command: >
      bash -lc 'echo "Checking DGX vLLM endpoint...";
      curl -fsS http://host.docker.internal:8000/v1/models
      -H "Authorization: Bearer ${LLM_API_KEY:-local-dgx-key}" &&
      echo "\nDGX vLLM endpoint OK"'

    restart: "no"

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    environment:
      BASE_URL: http://localhost:${SEARXNG_PORT:-8888}/
      INSTANCE_NAME: local-searxng
    volumes:
      - ${SEARXNG_STATE:-./searxng-state}:/etc/searxng
    restart: unless-stopped

  searxng-mcp:
    build:
      context: .
      dockerfile: Dockerfile.searxng-mcp
    image: local-searxng-mcp:latest
    pull_policy: build
    container_name: searxng-mcp
    depends_on:
      - searxng
    environment:
      SEARXNG_URL: http://searxng:8080
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8003
    ports:
      - "127.0.0.1:${SEARXNG_MCP_PORT:-8003}:8003"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8003/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped