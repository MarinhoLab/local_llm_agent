# compose.yml
# Single-command macOS client-side stack:
#   docker compose up

name: dgx-macos-agents

services:
  openhands:
    image: docker.openhands.dev/openhands/openhands:${OPENHANDS_TAG}
    container_name: openhands
    pull_policy: always

    ports:
      - "${OPENHANDS_PORT}:3000"

    environment:
      AGENT_SERVER_IMAGE_REPOSITORY: ${AGENT_SERVER_IMAGE_REPOSITORY}
      AGENT_SERVER_IMAGE_TAG: ${AGENT_SERVER_IMAGE_TAG}
      LOG_ALL_EVENTS: ${LOG_ALL_EVENTS}
      LLM_MODEL: ${LLM_MODEL}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      SANDBOX_VOLUME_MOUNTS: /workspace:/workspace

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${OPENHANDS_STATE}:/.openhands
      - ${WORKSPACE_DIR}:/workspace

    extra_hosts:
      - "host.docker.internal:host-gateway"

    stdin_open: true
    tty: true
    restart: unless-stopped

