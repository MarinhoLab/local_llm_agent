# ntfy/compose.yml — per-PC, self-hosted ntfy push server (single container).
#
# One of these runs on every PC that runs Agent Canvas. The Agent Canvas
# notifier (agent_canvas_native/ntfy_notifier.py) publishes to it on
# 127.0.0.1:<NTFY_PORT>; your phone reaches it over Tailscale at
# http://<this-pc>.tail:<NTFY_PORT>/<topic>.
#
# Config lives in ntfy/.env (copy ntfy/example.env -> ntfy/.env). All knobs
# are NTFY_* env vars read by the ntfy server; see https://ntfy.sh/docs/config
# for the full list.
#
# Security model (single user, Tailscale):
#   - The container is reachable on the Tailscale interface only (WireGuard
#     encrypts the traffic; the host firewall should keep the port off any
#     non-Tailscale interface).
#   - The unguessable topic name is the credential, the same model ntfy.sh
#     uses for its public topics. Anyone who knows the topic can read/write
#     it — so pick NTFY_TOPIC long and random.
#   - Optional: set NTFY_AUTH_FILE below to enable account auth (users,
#     ACLs, access tokens) for stronger protection. See ntfy/README.md
#     "Optional: account auth".

services:
  ntfy:
    image: binwiederhier/ntfy:latest   # pin a tag (e.g. :v2.11.0) for reproducible builds
    container_name: ntfy
    restart: unless-stopped
    # The image's ENTRYPOINT is `ntfy` with no default subcommand, so the
    # `serve` subcommand must be given explicitly or the container just
    # prints the CLI help and exits.
    command: serve
    # init: true lets Docker's init reap zombies — needed when a healthcheck
    # is configured (matches the official ntfy compose example).
    init: true
    ports:
      # Host port -> container port. ntfy listens on 80 inside the container;
      # we pick the host port.
      - "${NTFY_PORT:-2020}:80"
    environment:
      # Public URL phones use to subscribe. Set to this PC's Tailscale URL,
      # e.g. http://mac.tail:2020. If unset, ntfy infers from the request Host
      # header, which also works, but an explicit value is more reliable.
      - NTFY_BASE_URL=${NTFY_BASE_URL:-}
      # iOS push for self-hosted servers: ntfy forwards a lightweight
      # "poll request" to this upstream (ntfy.sh by default), which relays it
      # via APNs to the iOS app. Android uses instant delivery (a foreground
      # service) and does not need this. See ntfy/README.md.
      - NTFY_UPSTREAM_BASE_URL=${NTFY_UPSTREAM_BASE_URL:-https://ntfy.sh}
      # Optional: enable account auth (users, ACLs, access tokens). Unset by
      # default — on a Tailscale-only server the topic name is the credential.
      # If you set it, the dir must exist (a named/host volume works best) so
      # the SQLite DB persists. See ntfy/README.md "Optional: account auth".
      - NTFY_AUTH_FILE=${NTFY_AUTH_FILE:-}
      # Persist the message cache + attachments across container restarts.
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_ATTACHMENT_CACHE_DIR=/var/cache/ntfy/attachments
      # Optional: write server logs to a file in the volume.
      - NTFY_LOG_FILE=${NTFY_LOG_FILE:-}
    volumes:
      # Named volume for cache.db + attachments. Survives image upgrades.
      - ntfy-data:/var/cache/ntfy
      # User database dir, used only when NTFY_AUTH_FILE is set (optional
      # account auth). Default auth-file location is /var/lib/ntfy/user.db.
      - ntfy-auth:/var/lib/ntfy
    healthcheck:
      # ntfy serves a JSON health endpoint at /v1/health that returns
      # {"healthy": true}; match the official ntfy compose healthcheck.
      test: ["CMD-SHELL", "wget -q --tries=1 -O- http://127.0.0.1:80/v1/health | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  ntfy-data:
  ntfy-auth:
